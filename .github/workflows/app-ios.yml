# App de choferes para iPhone: se compila en la nube (Mac de GitHub) y se sube a TestFlight.
# Se corre a mano: GitHub → Actions → "App iPhone (TestFlight)" → Run workflow.
# Necesita estos secretos del repositorio (Settings → Secrets and variables → Actions), de la cuenta Apple Developer de la empresa:
#   APPLE_TEAM_ID     Team ID (Membership details)
#   ASC_KEY_ID        Key ID de la llave de App Store Connect (Users and Access → Integrations → App Store Connect API, rol App Manager)
#   ASC_ISSUER_ID     Issuer ID de esa misma pantalla
#   ASC_KEY_P8_BASE64 el archivo .p8 de la llave, en base64 (base64 -i AuthKey_XXXX.p8 | pbcopy)
name: App iPhone (TestFlight)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app-nativa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Revisar que estén los secretos
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          for v in TEAM KID ISS P8; do [ -n "${!v}" ] || { echo "::error::Falta un secreto de Apple ($v). Ver el encabezado de este archivo."; exit 1; }; done
      - name: Instalar y preparar el proyecto
        run: |
          npm ci --no-audit --no-fund
          npx cap sync ios
      - name: Llave de App Store Connect
        env:
          P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
          KID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$P8" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey_$KID.p8"
      - name: Compilar (archive)
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$KID.p8" \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" archive
      - name: Subir a TestFlight
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/salida" -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$KID.p8" \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS"
      - name: Borrar la llave
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
