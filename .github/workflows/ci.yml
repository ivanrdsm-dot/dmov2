# DMOV · CI — cada push a main valida el motor de negocio y el build
# antes de que nadie deploye a producción con algo roto.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, fix/verified-billing-requests]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # El lock se genera SIEMPRE con el npm de Node 22 (npm 10). Con npm 11 el lock
      # omite peers opcionales (esbuild de vite 8) y `npm ci` falla aquí.
      # Para regenerarlo: npx npm@10 install --package-lock-only
      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck (motor de negocio domain.ts)
        run: npm run typecheck

      - name: Tests (política de negocio protegida)
        run: npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Private fiscal archive and profile rules (isolated demo emulator)
        run: npm run test:security

      # Día completo de punta a punta (asignar → chofer → entregas → En vivo) con las funciones reales
      # en un Firebase de prueba ("demo-…": no toca producción).
      - name: Flujo completo de una ruta (emuladores con funciones)
        run: |
          npm ci --prefix functions
          printf "DMOV_CONECTOR_TOKEN=solo-pruebas\nVAPID_PRIVATE_KEY=solo-pruebas\n" > functions/.secret.local
          npm run test:e2e

      - name: Build de producción
        run: npm run build

      - name: Verificar grafo inicial (mapbox/xlsx/pdf deben ser lazy)
        run: |
          if grep -E 'modulepreload[^>]*(mapbox|xlsx|jspdf|pdf)' dist/index.html; then
            echo "::error::Una librería pesada volvió al grafo estático (modulepreload)"
            exit 1
          fi
          echo "✓ Librerías pesadas siguen lazy"

