<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f97316" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DMvimiento" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="DMvimiento Logistics OS - Sistema de gestión logística en tiempo real con tracking GPS, rutas optimizadas con IA y facturación integrada." />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>DMvimiento · Logistics OS</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <!-- Preconnect a servicios externos para reducir latencia en primera carga -->
    <link rel="preconnect" href="https://api.mapbox.com" />
    <link rel="preconnect" href="https://events.mapbox.com" />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
    <link rel="dns-prefetch" href="https://securetoken.googleapis.com" />
    <script>
      // Registra Service Worker para PWA (installable + offline support)
      // Si falla el registro no bloquea la app
      // En local (npm run dev / preview) NO se registra: el SW guarda los assets
      // cache-first y en desarrollo los módulos no llevan hash, así que servía
      // código viejo. Si quedó uno registrado de antes, se quita con su caché.
      if ('serviceWorker' in navigator) {
        var esLocal = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) || /\.(localhost|test)$/.test(location.hostname);
        if (esLocal) {
          navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }).catch(function () {});
          if (window.caches) caches.keys().then(function (ks) { ks.filter(function (k) { return k.indexOf('dmov-') === 0; }).forEach(function (k) { caches.delete(k); }); }).catch(function () {});
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
          });
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
